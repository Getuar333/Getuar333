<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Getuar Gashi — Software, shaped with intent</title>
  <desc id="description">An original midnight-blue identity banner with an illuminated geometric G monogram, fine architectural construction lines, and Getuar Gashi's name.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.62" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#15132d"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#44d9eb"/>
      <stop offset="0.48" stop-color="#548cff"/>
      <stop offset="1" stop-color="#b58cff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132442" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#28204b" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="micro-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a7c4ef" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#field)"/>
  <rect width="1200" height="400" rx="18" fill="url(#micro-grid)"/>
  <path d="M0 1H1200" stroke="url(#signal)" stroke-width="2"/>
  <path d="M756 0V400" stroke="#8fb1e9" stroke-opacity="0.16"/>

  <path d="M785 38H1160L1180 58V342L1160 362H785Z" fill="url(#panel)" stroke="#95b6e8" stroke-opacity="0.18"/>
  <path d="M785 38H916M1051 38H1160L1180 58V118M1180 282V342L1160 362H1082" fill="none" stroke="url(#signal)" stroke-width="1.5"/>

  <g fill="none" stroke="#8db1e6" stroke-opacity="0.14" stroke-width="1">
    <path d="M801 74H1152M801 326H1152"/>
    <path d="M826 53V347M1138 53V347"/>
    <circle cx="982" cy="200" r="137"/>
    <circle cx="982" cy="200" r="114" stroke-dasharray="2 8"/>
    <path d="M982 55V82M982 318V345M837 200H864M1100 200H1127"/>
  </g>

  <g fill="none" stroke="url(#signal)" stroke-width="2">
    <path d="M1042 109C1025 98 1005 92 982 92C922 92 878 138 878 200C878 262 922 308 982 308C1038 308 1074 272 1074 217H991V248H1037C1027 269 1008 280 983 280C937 280 908 247 908 200C908 153 938 120 983 120C1010 120 1030 130 1044 149"/>
