<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Getuar Gashi — Computer Science and Engineering</title>
  <desc id="description">A dark navy technical banner with a blue-violet architectural line motif and the name Getuar Gashi.</desc>
  <defs>
