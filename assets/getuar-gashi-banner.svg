    <circle cx="1111" cy="132" r="4"/>
    <circle cx="1120" cy="242" r="4"/>
    <circle cx="982" cy="67" r="4"/>
    <circle cx="982" cy="333" r="4"/>
  </g>

  <path d="M80 62V338" stroke="url(#signal)" stroke-width="2"/>
  <text x="106" y="73" fill="#9bb0d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="3.2">GETUAR GASHI <tspan fill="#59739c">/</tspan> SOFTWARE ENGINEERING</text>

  <text x="101" y="190" fill="#f1f5ff" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="600" letter-spacing="-3.6">Getuar Gashi</text>
  <path d="M106 217H329" stroke="url(#signal)" stroke-width="2"/>
  <circle cx="337" cy="217" r="3" fill="#9d86ff"/>

  <text x="106" y="259" fill="#c6d5ec" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="0.3">Computer Science &amp; Engineering student</text>
  <text x="106" y="291" fill="#8fa6ca" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="0.4">Web, mobile, and the systems that bring them together.</text>

  <g fill="#7890b5" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="2">
